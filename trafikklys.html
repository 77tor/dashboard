<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arbeidsro - Trafikklys med Støyvarsling</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      user-select: none;
      overflow: hidden;
      transition: background-color 0.2s ease;
    }

    /* RØD BLINK / ALARM VED FÖR HØY STØY */
    body.alarm-active {
      animation: blink-bg 0.4s infinite alternate;
    }

    @keyframes blink-bg {
      from { background-color: #0f172a; }
      to { background-color: #7f1d1d; }
    }

    /* FORSTØRRET TRAFIKKLYS-RAMME */
    .traffic-light {
      background: #1e293b;
      border: 6px solid #334155;
      border-radius: 50px;
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      gap: 22px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
    }

    /* LYS-KNAPPER */
    .light {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 4px solid rgba(0, 0, 0, 0.4);
      cursor: pointer;
      opacity: 0.2;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .light:hover {
      opacity: 0.45;
      transform: scale(1.04);
    }

    /* RØDT LYS */
    .light.red { background-color: #ef4444; }
    .light.red.active {
      opacity: 1;
      box-shadow: 0 0 60px #ef4444, inset 0 0 25px rgba(255, 255, 255, 0.7);
      transform: scale(1.06);
    }

    /* GULT LYS */
    .light.yellow { background-color: #eab308; }
    .light.yellow.active {
      opacity: 1;
      box-shadow: 0 0 60px #eab308, inset 0 0 25px rgba(255, 255, 255, 0.7);
      transform: scale(1.06);
    }

    /* GRØNT LYS */
    .light.green { background-color: #22c55e; }
    .light.green.active {
      opacity: 1;
      box-shadow: 0 0 60px #22c55e, inset 0 0 25px rgba(255, 255, 255, 0.7);
      transform: scale(1.06);
    }

    /* INFORMASJONSTEKST */
    .status-container {
      margin-top: 20px;
      text-align: center;
      max-width: 700px;
    }

    .status-title {
      font-size: 3rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 6px;
      transition: color 0.3s ease;
    }

    .status-desc {
      font-size: 1.4rem;
      color: #cbd5e1;
      line-height: 1.3;
      font-weight: 500;
    }

    /* STØYMÅLER OMRÅDE */
    .mic-controls {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .mic-btn {
      background: #334155;
      color: white;
      border: 1px solid #475569;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .mic-btn.active {
      background: #0284c7;
      border-color: #38bdf8;
    }

    /* VOLUMMÅLER-BAR */
    .volume-meter-container {
      width: 250px;
      height: 10px;
      background: #1e293b;
      border-radius: 5px;
      overflow: hidden;
      border: 1px solid #334155;
    }

    .volume-meter-bar {
      height: 100%;
      width: 0%;
      background: #22c55e;
      transition: width 0.1s ease, background-color 0.2s ease;
    }
  </style>
</head>
<body>

  <!-- TRAFIKKLYS -->
  <div class="traffic-light">
    <div class="light red" onclick="settLys('red')" title="Helt stille"></div>
    <div class="light yellow" onclick="settLys('yellow')" title="Lav viskestemme"></div>
    <div class="light green" onclick="settLys('green')" title="Samtalestemme"></div>
  </div>

  <!-- STATUSMELDING -->
  <div class="status-container">
    <div id="statusTitle" class="status-title" style="color: #64748b;">Velg lydnivå</div>
    <div id="statusDesc" class="status-desc">Trykk på et av lysene for å vise regelen.</div>
  </div>

  <!-- STØYOVERVÅKING / MIKROFON -->
  <div class="mic-controls">
    <button id="micBtn" class="mic-btn" onclick="toggleMicrophone()">
      🎙️ Aktiver Støymåler
    </button>
    <div class="volume-meter-container">
      <div id="volumeBar" class="volume-meter-bar"></div>
    </div>
  </div>

  <script>
    const regler = {
      red: {
        tittel: "Helt stille",
        beskrivelse: "Det skal være individuelt arbeid uten prating i klasserommet.",
        farge: "#ef4444",
        threshold: 28 // dB-terskel (lav toleranse)
      },
      yellow: {
        tittel: "Lav viskestemme",
        beskrivelse: "Det er lov å snakke lavt til den som sitter nærmest deg.",
        farge: "#eab308",
        threshold: 48 // dB-terskel (middels toleranse)
      },
      green: {
        tittel: "Samtalestemme",
        beskrivelse: "Det er lov å snakke sammen i grupper med vanlige stemmer.",
        farge: "#22c55e",
        threshold: 68 // dB-terskel (høy toleranse)
      }
    };

    let aktivFarge = 'red';
    let audioCtx = null;
    let analyser = null;
    let micStream = null;
    let isListening = false;
    let overThresholdCounter = 0;
    let alarmCoolDown = false;

    function settLys(farge) {
      aktivFarge = farge;
      document.querySelectorAll('.light').forEach(el => el.classList.remove('active'));

      const valgtLys = document.querySelector(`.light.${farge}`);
      if (valgtLys) valgtLys.classList.add('active');

      const info = regler[farge];
      const titleEl = document.getElementById('statusTitle');
      const descEl = document.getElementById('statusDesc');

      titleEl.innerText = info.tittel;
      titleEl.style.color = info.farge;
      descEl.innerText = info.beskrivelse;

      localStorage.setItem('trafikklys_status', farge);
    }

    // --- MIKROFON & STØYMÅLING ---

    async function toggleMicrophone() {
      const micBtn = document.getElementById('micBtn');

      if (!isListening) {
        try {
          micStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          analyser = audioCtx.createAnalyser();
          
          const source = audioCtx.createMediaStreamSource(micStream);
          source.connect(analyser);
          
          analyser.fftSize = 256;
          isListening = true;
          
          micBtn.classList.add('active');
          micBtn.innerHTML = '🎙️ Støymåler Aktiv';
          
          processAudio();
        } catch (err) {
          alert('Kunne ikke få tilgang til mikrofonen. Sjekk at nettleseren har tillatelse.');
          console.error(err);
        }
      } else {
        stopMicrophone();
      }
    }

    function stopMicrophone() {
      if (micStream) {
        micStream.getTracks().forEach(track => track.stop());
      }
      if (audioCtx) {
        audioCtx.close();
      }
      isListening = false;
      const micBtn = document.getElementById('micBtn');
      micBtn.classList.remove('active');
      micBtn.innerHTML = '🎙️ Aktiver Støymåler';
      document.getElementById('volumeBar').style.width = '0%';
    }

    function processAudio() {
      if (!isListening) return;

      const dataArray = new Uint8Array(analyser.frequencyBinCount);
      analyser.getByteFrequencyData(dataArray);

      // Beregn gjennomsnittlig volum
      let sum = 0;
      for (let i = 0; i < dataArray.length; i++) {
        sum += dataArray[i];
      }
      const average = sum / dataArray.length;
      const volume = Math.round((average / 128) * 100); // 0 - 100 skalert

      // Oppdater volumbaren
      const volumeBar = document.getElementById('volumeBar');
      volumeBar.style.width = Math.min(volume, 100) + '%';

      const currentThreshold = regler[aktivFarge].threshold;

      // Sjekk om volumet overskrider grensen
      if (volume > currentThreshold) {
        volumeBar.style.backgroundColor = '#ef4444';
        overThresholdCounter++;

        // Hvis støyen vedvarer i ca 1.2 sekunder (ca 30 frames)
        if (overThresholdCounter > 25 && !alarmCoolDown) {
          triggerAlarm();
        }
      } else {
        volumeBar.style.backgroundColor = '#22c55e';
        if (overThresholdCounter > 0) overThresholdCounter--;
      }

      requestAnimationFrame(processAudio);
    }

    // UTLOSE ALARM (BLINKING OG PIPETONE)
    function triggerAlarm() {
      alarmCoolDown = true;
      document.body.classList.add('alarm-active');
      playWarningSound();

      setTimeout(() => {
        document.body.classList.remove('alarm-active');
        overThresholdCounter = 0;
        alarmCoolDown = false;
      }, 2500); // Alarm varer i 2.5 sekunder
    }

    // GENERER PIPETONE FOR VARSEL
    function playWarningSound() {
      try {
        const soundCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = soundCtx.createOscillator();
        const gain = soundCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, soundCtx.currentTime); // A4-tone
        osc.frequency.exponentialRampToValueAtTime(220, soundCtx.currentTime + 0.4);

        gain.gain.setValueAtTime(0.3, soundCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, soundCtx.currentTime + 0.4);

        osc.connect(gain);
        gain.connect(soundCtx.destination);

        osc.start();
        osc.stop(soundCtx.currentTime + 0.4);
      } catch (e) {
        console.error("Lydavspilling feilet", e);
      }
    }

    // OPPSTARTS-OPPSETT
    document.addEventListener('DOMContentLoaded', () => {
      const lagretFarge = localStorage.getItem('trafikklys_status') || 'red';
      settLys(lagretFarge);
    });
  </script>
</body>
</html>
