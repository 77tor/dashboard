<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <title>Hjem - Hånes skole</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #e0f2fe 0%, #f0fdf4 50%, #fef3c7 100%);
      color: #1e293b;
      min-height: 100vh;
      padding: 25px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .header-container { 
      text-align: center; 
      margin-bottom: 30px; 
      cursor: pointer;
      user-select: none;
    }
    
    .school-logo { 
      max-width: 210px; 
      filter: drop-shadow(0 8px 15px rgba(0,0,0,0.1));
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    
    .school-logo:hover { 
      transform: scale(1.08) rotate(-2deg); 
    }

    .welcome-title { 
      font-size: 1.6rem; 
      font-weight: 800;
      color: #0f172a; 
      margin-top: 10px;
      background: linear-gradient(45deg, #2563eb, #7c3aed);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 950px;
    }

    .resource-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 20px 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      position: relative;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 8px 0px var(--shadow-color), 0 15px 20px rgba(0,0,0,0.06);
      border: 3px solid var(--border-color);
    }

    .resource-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 14px 0px var(--shadow-color), 0 20px 25px rgba(0,0,0,0.1);
    }

    .resource-card:active {
      transform: translateY(2px);
      box-shadow: 0 4px 0px var(--shadow-color), 0 8px 10px rgba(0,0,0,0.1);
    }

    .card-img-wrapper { 
      height: 80px; 
      width: 100%;
      display: flex; 
      align-items: center; 
      justify-content: center;
      margin-bottom: 12px;
    }

    .card-img { 
      max-width: 90%; 
      max-height: 100%; 
      object-fit: contain; 
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.05));
    }

    .card-btn {
      width: 100%;
      padding: 8px 0;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.95rem;
      color: white;
      background-color: var(--btn-bg);
      text-align: center;
      box-shadow: 0 4px 0px var(--btn-shadow);
      margin-top: auto;
    }

    .card-nrk {
      --border-color: #bae6fd;
      --shadow-color: #38bdf8;
      --btn-bg: #0284c7;
      --btn-shadow: #0369a1;
    }
    
    .card-salaby {
      --border-color: #fef08a;
      --shadow-color: #facc15;
      --btn-bg: #eab308;
      --btn-shadow: #ca8a04;
    }

    .card-korarti {
      --border-color: #fbcfe8;
      --shadow-color: #f472b6;
      --btn-bg: #db2777;
      --btn-shadow: #be185d;
    }

    .card-super {
      --border-color: #bbf7d0;
      --shadow-color: #4ade80;
      --btn-bg: #16a34a;
      --btn-shadow: #15803d;
    }

    .card-tv2 {
      --border-color: #ddd6fe;
      --shadow-color: #a78bfa;
      --btn-bg: #7c3aed;
      --btn-shadow: #6d28d9;
    }


/* --- BOKORM OG BØKER CONTAINER --- */
/* --- BOKORM OG BØKER CONTAINER --- */
.bookworm-container {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100vw;
  height: 70px;
  pointer-events: none;
  z-index: 99;
  overflow: hidden;
}

/* BØKENE I BAKGRUNNEN (FORDELT OVER HELE BREDDEN) */
.books-shelf {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  display: flex !important;
  flex-direction: row !important;
  justify-content: space-between !important; /* Sprer stablene fra venstre til høyre */
  align-items: flex-end;
  padding: 0 40px !important;
  box-sizing: border-box !important;
  z-index: 1;
}

/* GRUPPERING AV BØKER I STABLER */
.book-group {
  display: flex !important;
  align-items: flex-end;
  gap: 3px;
}

.book {
  width: var(--w);
  height: var(--h);
  background-color: var(--bg);
  border-radius: 3px 3px 0 0;
  transform: rotate(var(--r));
  transform-origin: bottom center;
  border-left: 2px solid rgba(255, 255, 255, 0.25);
  box-shadow: 2px 0 4px rgba(0, 0, 0, 0.15);
  position: relative;
}

.book::after {
  content: '';
  position: absolute;
  top: 6px;
  left: 0;
  width: 100%;
  height: 3px;
  background: rgba(255, 255, 255, 0.4);
}

/* BOKORMEN PÅ GULVET */
.bookworm {
  width: 210px;
  height: 70px;
  position: absolute;
  bottom: -4px; /* Forankrer ormen helt nede på kanten */
  z-index: 2; /* Kravler foran bøkene */
  animation: crawlAcross 130s linear infinite;
}

@keyframes crawlAcross {
  0% {
    left: -230px;
    transform: scaleX(1);
  }
  48% {
    left: 100vw;
    transform: scaleX(1);
  }
  50% {
    left: 100vw;
    transform: scaleX(-1);
  }
  98% {
    left: -230px;
    transform: scaleX(-1);
  }
  100% {
    left: -230px;
    transform: scaleX(1);
  }
}

/* BØYE-ANIMASJON (MED ANKER I BUNNEN) */
.worm-whole {
  animation: inchWormBevegelse 4.8s ease-in-out infinite;
  transform-origin: 20px 60px; /* Ankerpunkt helt nederst på halen */
}

@keyframes inchWormBevegelse {
  0%, 100% {
    transform: scaleX(1) scaleY(1) translateY(0);
  }
  45% {
    transform: scaleX(0.72) scaleY(1.35) translateY(-2px);
  }
}


  </style>
</head>
<body>

  <!-- SKOLE-LOGO MED KONFETTI-FEIRING -->
  <div class="header-container" onclick="fyrAvKonfetti()" title="Klikk for en overraskelse! 🎉">
    <img src="haanes.png" alt="Hånes skole" class="school-logo">

  </div>

<!-- RESSURSKORT SOM ÅPNER SIKKERT I NY FANE -->
  <div class="grid-container">

    <a href="https://tv.nrk.no/programmer/nrk-skole" target="_blank" class="resource-card card-nrk">
      <div class="card-img-wrapper">
        <img src="Bilder/nrkskole.png" alt="NRK Skole" class="card-img">
      </div>
      <div class="card-btn">NRK Skole 🎬</div>
    </a>

    <a href="https://skole.salaby.no/" target="_blank" class="resource-card card-salaby">
      <div class="card-img-wrapper">
        <img src="Bilder/salaby.png" alt="Salaby" class="card-img">
      </div>
      <div class="card-btn">Salaby 🐝</div>
    </a>

    <a href="https://www.korarti.no/" target="_blank" class="resource-card card-korarti">
      <div class="card-img-wrapper">
        <img src="Bilder/korarti.png" alt="Korarti" class="card-img">
      </div>
      <div class="card-btn">Korarti 🎵</div>
    </a>

    <a href="https://tv.nrk.no/nrksuper/" target="_blank" class="resource-card card-super">
      <div class="card-img-wrapper">
        <img src="Bilder/nrksuper.png" alt="NRK Super" class="card-img">
      </div>
      <div class="card-btn">NRK Super 🚀</div>
    </a>

    <a href="https://www.elevkanalen.no/" target="_blank" class="resource-card card-tv2">
      <div class="card-img-wrapper">
        <img src="Bilder/tv2skole.png" alt="Elevkanalen" class="card-img">
      </div>
      <div class="card-btn">Elevkanalen 📺</div>
    </a>

  </div>

  <script>
    function fyrAvKonfetti() {
      if (typeof confetti === 'function') {
        confetti({ 
          particleCount: 100, 
          spread: 70, 
          origin: { y: 0.3 } 
        });
      }
    }
  </script>

<!-- ANIMERT BOKORM (KRAVLER PÅ GULVET) -->
<div class="bookworm-container">
  
<!-- BØKER I BAKGRUNNEN (FORDELT OVER HELE BREDDEN) -->
  <div class="books-shelf">
    <!-- Stabel 1 (Venstre) -->
    <div class="book-group">
      <div class="book" style="--bg: #e91e63; --h: 38px; --w: 14px; --r: -4deg;"></div>
      <div class="book" style="--bg: #3b82f6; --h: 50px; --w: 18px; --r: 0deg;"></div>
      <div class="book" style="--bg: #10b981; --h: 42px; --w: 16px; --r: 3deg;"></div>
      <div class="book" style="--bg: #f59e0b; --h: 54px; --w: 20px; --r: -2deg;"></div>
      <div class="book" style="--bg: #8b5cf6; --h: 40px; --w: 15px; --r: 0deg;"></div>
    </div>
    
    <!-- Stabel 2 -->
    <div class="book-group">
      <div class="book" style="--bg: #ef4444; --h: 48px; --w: 17px; --r: -6deg;"></div>
      <div class="book" style="--bg: #06b6d4; --h: 58px; --w: 22px; --r: 0deg;"></div>
      <div class="book" style="--bg: #84cc16; --h: 38px; --w: 14px; --r: 4deg;"></div>
    </div>
    
    <!-- Stabel 3 (Midten) -->
    <div class="book-group">
      <div class="book" style="--bg: #ec4899; --h: 52px; --w: 19px; --r: -3deg;"></div>
      <div class="book" style="--bg: #6366f1; --h: 44px; --w: 16px; --r: 0deg;"></div>
      <div class="book" style="--bg: #14b8a6; --h: 48px; --w: 18px; --r: 5deg;"></div>
    </div>

    <!-- Stabel 4 -->
    <div class="book-group">
      <div class="book" style="--bg: #a855f7; --h: 56px; --w: 21px; --r: -4deg;"></div>
      <div class="book" style="--bg: #0284c7; --h: 40px; --w: 15px; --r: 0deg;"></div>
      <div class="book" style="--bg: #22c55e; --h: 45px; --w: 17px; --r: 2deg;"></div>
    </div>

    <!-- Stabel 5 (Helt til høyre) -->
    <div class="book-group">
      <div class="book" style="--bg: #f43f5e; --h: 46px; --w: 18px; --r: -3deg;"></div>
      <div class="book" style="--bg: #eab308; --h: 52px; --w: 20px; --r: 0deg;"></div>
      <div class="book" style="--bg: #3b82f6; --h: 39px; --w: 15px; --r: 4deg;"></div>
    </div>
  </div>

  <!-- BOKORMEN (PLACERT PÅ BUNNLINJEN) -->
  <svg class="bookworm" viewBox="0 0 240 70">
    <g class="worm-whole">
      <!-- Alle ledd er flyttet ned til cy="60" -->
      <circle cx="20" cy="60" r="9.5" fill="#16a34a" />
      <circle cx="34" cy="60" r="10.5" fill="#22c55e" />
      <circle cx="50" cy="60" r="11" fill="#16a34a" />
      <circle cx="67" cy="60" r="11.5" fill="#22c55e" />
      <circle cx="85" cy="60" r="12" fill="#16a34a" />
      <circle cx="103" cy="60" r="11.5" fill="#22c55e" />
      <circle cx="120" cy="60" r="11" fill="#16a34a" />
      <circle cx="136" cy="60" r="10.5" fill="#22c55e" />
      
      <!-- Hode fast på bunnen -->
      <g transform="translate(154, 56)">
        <circle cx="0" cy="0" r="14" fill="#4ade80" />
        <circle cx="5" cy="-5" r="3.5" fill="#ffffff" />
        <circle cx="6.5" cy="-5" r="1.8" fill="#000000" />
        <path d="M 2 -13 Q 6 -22 12 -24" stroke="#16a34a" stroke-width="2.5" fill="none" stroke-linecap="round" />
        <circle cx="12" cy="-24" r="3" fill="#e91e63" />
        <path d="M 1 5 Q 6 9 10 4" stroke="#000000" stroke-width="2" fill="none" stroke-linecap="round" />
        <rect x="-19" y="3" width="16" height="12" rx="2" fill="#e91e63" transform="rotate(-10)" />
        <line x1="-11" y1="2" x2="-11" y2="13" stroke="#ffffff" stroke-width="1.2" />
      </g>
    </g>
  </svg>

</div>

</body>
</html>
