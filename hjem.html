<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <title>Hjem - Hånes skole</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: linear-gradient(135deg, #e0f2fe 0%, #f0fdf4 50%, #fef3c7 100%);
  color: #1e293b;
  height: 100vh;
  margin: 0;
  padding: 20px 20px 80px; /* Litt padding i bunnen for å holde avstand til bokormen */
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start; /* Dytter alt opp mot toppen */
  position: relative;
  overflow: hidden;
}

/* --- BIEN SOM KRASJER OG KRABBER BORT --- */
    .bee-container {
      position: absolute;
      top: 15px;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 100;
      overflow: hidden;
    }

    .flying-bee {
      width: 45px;
      height: 45px;
      position: absolute;
      top: 25px;
      left: -80px;
      opacity: 0; /* Usynlig frem til animasjonen starter */
      /* Venter 60 sekunder (1 min) før FØRSTE tur. */
      animation-delay: 60s; 
      /* Totalt 318 sekunder = ~18s animasjon + 300s (5 min) pause */
      animation-name: crashAndCrawl;
      animation-duration: 318s;
      animation-timing-function: cubic-bezier(0.4, 0, 0.6, 1);
      animation-iteration-count: infinite;
    }

    /* Vinger som blafrer raskt */
    .wing {
      animation: flapWings 0.15s ease-in-out infinite alternate;
      transform-origin: center bottom;
    }

    @keyframes flapWings {
      0% { transform: scaleY(1) rotate(0deg); }
      100% { transform: scaleY(0.3) rotate(-15deg); }
    }

    /* Animasjonsforløp: Rett inn -> KRASJ -> Sakte fall -> Krabber ut -> 5 MIN PAUSE */
    @keyframes crashAndCrawl {
      /* 1. Startposisjon (Blir synlig i det animasjonen setter i gang) */
      0% {
        top: 25px;
        left: -80px;
        transform: scaleX(1) rotate(5deg);
        opacity: 1;
      }
      
      /* 2. Flyr rett mot logoen og KRASJER BRÅTT (~1 sekund) */
      0.3% {
        left: calc(50% - 10px);
        top: 40px;
        transform: scaleX(1) rotate(45deg);
        opacity: 1;
      }
      
      /* 3. Reaksjon og risting rett etter krasjen */
      0.4% {
        left: 50%;
        top: 35px;
        transform: scaleX(1) rotate(-35deg);
      }
      0.5% {
        left: calc(50% - 15px);
        top: 45px;
        transform: scaleX(1) rotate(180deg);
      }

      /* 4. SAKTE OG LETT FALL NEDOVER */
      1.8% {
        left: calc(50% - 8px);
        top: calc(100% - 65px);
        transform: scaleX(1) rotate(110deg);
      }

      /* 5. Lander mykt på bakken og reiser seg opp */
      2.2% {
        left: calc(50% - 5px);
        top: calc(100% - 55px);
        transform: scaleX(1) rotate(90deg);
      }
      2.5% {
        left: 50%;
        top: calc(100% - 50px);
        transform: scaleX(1) rotate(0deg);
      }

      /* 6. Krabber helt ut av skjermen til høyre */
      3.2% {
        left: calc(50% + 50px);
        top: calc(100% - 50px);
        transform: scaleX(1) rotate(-5deg);
      }
      4.2% {
        left: calc(50% + 200px);
        top: calc(100% - 50px);
        transform: scaleX(1) rotate(5deg);
      }
      5.5% {
        left: calc(100% + 80px);
        top: calc(100% - 50px);
        transform: scaleX(1) rotate(0deg);
        opacity: 1;
      }
      
      /* 7. Blir usynlig i det den passerer kanten */
      5.6% {
        left: calc(100% + 80px);
        top: calc(100% - 50px);
        opacity: 0;
      }

      /* 8. Teleporterer usynlig tilbake til start i venstre hjørne */
      5.7% {
        top: 25px;
        left: -80px;
        opacity: 0;
      }

      /* 9. PAUSE I 5 MINUTTER (Holdes helt usynlig fra 5.8% til 100%) */
      5.8%, 99.9% {
        top: 25px;
        left: -80px;
        opacity: 0;
      }
      100% {
        top: 25px;
        left: -80px;
        opacity: 1;
      }
    }



.header-container { 
  text-align: center; 
  margin-bottom: 15px;    /* Redusert fra 30px for å spare vertikal plass */
  cursor: pointer;
  user-select: none;
  position: relative;
  z-index: 10;
}
    
.school-logo { 
  max-width: 210px;       /* Justert fra 210px for å gi rom i høyden */
  filter: drop-shadow(0 8px 15px rgba(0,0,0,0.1));
  transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}

    .welcome-title { 
      font-size: 1.6rem; 
      font-weight: 800;
      color: #0f172a; 
      margin-top: 10px;
      background: linear-gradient(45deg, #2563eb, #7c3aed);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 950px;
      position: relative;
      z-index: 10;
    }

    .resource-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 20px 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      position: relative;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 8px 0px var(--shadow-color), 0 15px 20px rgba(0,0,0,0.06);
      border: 3px solid var(--border-color);
    }

    .resource-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 14px 0px var(--shadow-color), 0 20px 25px rgba(0,0,0,0.1);
    }

    .resource-card:active {
      transform: translateY(2px);
      box-shadow: 0 4px 0px var(--shadow-color), 0 8px 10px rgba(0,0,0,0.1);
    }

    .card-img-wrapper { 
      height: 80px; 
      width: 100%;
      display: flex; 
      align-items: center; 
      justify-content: center;
      margin-bottom: 12px;
    }

    .card-img { 
      max-width: 90%; 
      max-height: 100%; 
      object-fit: contain; 
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.05));
    }

    .card-btn {
      width: 100%;
      padding: 8px 0;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.95rem;
      color: white;
      background-color: var(--btn-bg);
      text-align: center;
      box-shadow: 0 4px 0px var(--btn-shadow);
      margin-top: auto;
    }

    .card-nrk {
      --border-color: #bae6fd;
      --shadow-color: #38bdf8;
      --btn-bg: #0284c7;
      --btn-shadow: #0369a1;
    }
    
    .card-salaby {
      --border-color: #fef08a;
      --shadow-color: #facc15;
      --btn-bg: #eab308;
      --btn-shadow: #ca8a04;
    }

    .card-korarti {
      --border-color: #fbcfe8;
      --shadow-color: #f472b6;
      --btn-bg: #db2777;
      --btn-shadow: #be185d;
    }

    .card-super {
      --border-color: #bbf7d0;
      --shadow-color: #4ade80;
      --btn-bg: #16a34a;
      --btn-shadow: #15803d;
    }

    .card-tv2 {
      --border-color: #ddd6fe;
      --shadow-color: #a78bfa;
      --btn-bg: #7c3aed;
      --btn-shadow: #6d28d9;
    }

    /* --- BOKORM OG BØKER CONTAINER --- */
    .bookworm-container {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100vw;
      height: 70px;
      pointer-events: none;
      z-index: 99;
      overflow: hidden;
    }

    .books-shelf {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      display: flex !important;
      flex-direction: row !important;
      justify-content: space-between !important;
      align-items: flex-end;
      padding: 0 40px !important;
      box-sizing: border-box !important;
      z-index: 1;
    }

    .book-group {
      display: flex !important;
      align-items: flex-end;
      gap: 3px;
    }

    .book {
      width: var(--w);
      height: var(--h);
      background-color: var(--bg);
      border-radius: 3px 3px 0 0;
      transform: rotate(var(--r));
      transform-origin: bottom center;
      border-left: 2px solid rgba(255, 255, 255, 0.25);
      box-shadow: 2px 0 4px rgba(0, 0, 0, 0.15);
      position: relative;
    }

    .book::after {
      content: '';
      position: absolute;
      top: 6px;
      left: 0;
      width: 100%;
      height: 3px;
      background: rgba(255, 255, 255, 0.4);
    }

    .bookworm {
      width: 210px;
      height: 70px;
      position: absolute;
      bottom: -4px;
      z-index: 2;
      animation: crawlAcross 130s linear infinite;
    }

    @keyframes crawlAcross {
      0% { left: -230px; transform: scaleX(1); }
      48% { left: 100vw; transform: scaleX(1); }
      50% { left: 100vw; transform: scaleX(-1); }
      98% { left: -230px; transform: scaleX(-1); }
      100% { left: -230px; transform: scaleX(1); }
    }

    .worm-whole {
      animation: inchWormBevegelse 4.8s ease-in-out infinite;
      transform-origin: 20px 60px;
    }

    @keyframes inchWormBevegelse {
      0%, 100% { transform: scaleX(1) scaleY(1) translateY(0); }
      45% { transform: scaleX(0.72) scaleY(1.35) translateY(-2px); }
    }
  </style>
</head>
<body>

  <!-- ANIMERT BIE SOM SVINGER UNNA LOGOEN -->
  <div class="bee-container">
    <svg class="flying-bee" viewBox="0 0 100 100">
      <!-- Vinger -->

      <ellipse class="wing" cx="58" cy="22" rx="10" ry="20" fill="rgba(224, 242, 254, 0.85)" stroke="#0284c7" stroke-width="2" transform="rotate(15 58 22)" />
      
      <!-- Kropp -->
      <ellipse cx="50" cy="55" rx="28" ry="20" fill="#facc15" stroke="#1e293b" stroke-width="2.5" />
      
      <!-- Svarte striper -->
      <path d="M 38 37 Q 36 55 38 73" stroke="#1e293b" stroke-width="6" fill="none" stroke-linecap="round" />

      <path d="M 62 37 Q 60 55 62 73" stroke="#1e293b" stroke-width="6" fill="none" stroke-linecap="round" />

      <circle cx="75" cy="51" r="3.5" fill="#ffffff" />

  <!-- SKOLE-LOGO MED KONFETTI-FEIRING -->

    <img src="haanes.png" alt="Hånes skole" class="school-logo">
  </div>

  <!-- RESSURSKORT SOM ÅPNER SIKKERT I NY FANE -->
  <div class="grid-container">

    <a href="https://tv.nrk.no/programmer/nrk-skole" target="_blank" class="resource-card card-nrk">
      <div class="card-img-wrapper">
        <img src="Bilder/nrkskole.png" alt="NRK Skole" class="card-img">
      </div>
      <div class="card-btn">NRK Skole 🎬</div>
    </a>

    <a href="https://skole.salaby.no/" target="_blank" class="resource-card card-salaby">
      <div class="card-img-wrapper">
        <img src="Bilder/salaby.png" alt="Salaby" class="card-img">
      </div>
      <div class="card-btn">Salaby 🐝</div>
    </a>

    <a href="https://www.korarti.no/" target="_blank" class="resource-card card-korarti">
      <div class="card-img-wrapper">
        <img src="Bilder/korarti.png" alt="Korarti" class="card-img">
      </div>
      <div class="card-btn">Korarti 🎵</div>
    </a>

    <a href="https://tv.nrk.no/nrksuper/" target="_blank" class="resource-card card-super">
      <div class="card-img-wrapper">
        <img src="Bilder/nrksuper.png" alt="NRK Super" class="card-img">
      </div>
      <div class="card-btn">NRK Super 🚀</div>
    </a>

    <a href="https://www.elevkanalen.no/" target="_blank" class="resource-card card-tv2">
      <div class="card-img-wrapper">
        <img src="Bilder/tv2skole.png" alt="Elevkanalen" class="card-img">
      </div>
      <div class="card-btn">Elevkanalen 📺</div>
    </a>

  </div>

  <script>

      if (typeof confetti === 'function') {
        confetti({ 
          particleCount: 100, 
          spread: 70, 
          origin: { y: 0.3 } 
        });
      }
    }
  </script>

    <div class="books-shelf">
      <div class="book-group">
        <div class="book" style="--bg: #e91e63; --h: 38px; --w: 14px; --r: -4deg;"></div>
        <div class="book" style="--bg: #3b82f6; --h: 50px; --w: 18px; --r: 0deg;"></div>

</body>
