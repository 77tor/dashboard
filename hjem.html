<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <title>Hjem - Hånes skole</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #e0f2fe 0%, #f0fdf4 50%, #fef3c7 100%);
      color: #1e293b;
      height: 100vh;
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* --- BIEN SOM KRASJER OG KRABBER BORT --- */
    .bee-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 100;
      overflow: hidden;
    }

    .flying-bee {
      width: 45px;
      height: 45px;
      position: absolute;
      top: 25px;
      left: -80px;
      opacity: 0;
      animation-delay: 60s; 
      animation-name: crashAndCrawl;
      animation-duration: 318s;
      animation-timing-function: cubic-bezier(0.4, 0, 0.6, 1);
      animation-iteration-count: infinite;
    }

    .wing {
      animation: flapWings 0.15s ease-in-out infinite alternate;
      transform-origin: center bottom;
    }

    @keyframes flapWings {
      0% { transform: scaleY(1) rotate(0deg); }
      100% { transform: scaleY(0.3) rotate(-15deg); }
    }

    @keyframes crashAndCrawl {
      0% { top: 25px; left: -80px; transform: scaleX(1) rotate(5deg); opacity: 1; }
      0.3% { left: calc(50% - 10px); top: 40px; transform: scaleX(1) rotate(45deg); opacity: 1; }
      0.4% { left: 50%; top: 35px; transform: scaleX(1) rotate(-35deg); }
      0.5% { left: calc(50% - 15px); top: 45px; transform: scaleX(1) rotate(180deg); }
      1.8% { left: calc(50% - 8px); top: calc(100% - 65px); transform: scaleX(1) rotate(110deg); }
      2.2% { left: calc(50% - 5px); top: calc(100% - 55px); transform: scaleX(1) rotate(90deg); }
      2.5% { left: 50%; top: calc(100% - 50px); transform: scaleX(1) rotate(0deg); }
      3.2% { left: calc(50% + 50px); top: calc(100% - 50px); transform: scaleX(1) rotate(-5deg); }
      4.2% { left: calc(50% + 200px); top: calc(100% - 50px); transform: scaleX(1) rotate(5deg); }
      5.5% { left: calc(100% + 80px); top: calc(100% - 50px); transform: scaleX(1) rotate(0deg); opacity: 1; }
      5.6% { left: calc(100% + 80px); top: calc(100% - 50px); opacity: 0; }
      5.7% { top: 25px; left: -80px; opacity: 0; }
      5.8%, 99.9% { top: 25px; left: -80px; opacity: 0; }
      100% { top: 25px; left: -80px; opacity: 1; }
    }

    /* --- SIRKELOPPSETT FOR SENTRUM OG KORT --- */
    .circle-container {
      position: relative;
      width: 620px;
      height: 620px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      margin-top: -40px; /* Flyttet hele elementet litt høyere på siden */
    }

    .header-container { 
      position: absolute;
      text-align: center; 
      cursor: pointer;
      user-select: none;
      z-index: 20;
    }
        
    .school-logo { 
      max-width: 220px;
      filter: drop-shadow(0 8px 15px rgba(0,0,0,0.1));
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .school-logo:hover {
      transform: scale(1.05);
    }

    /* KORT SOM PLASSERES I SIRKEL */
    .resource-card {
      position: absolute;
      width: 155px; /* Økt bredde på kortene for å gi rom for større bilde */
      background: #ffffff;
      border-radius: 18px;
      padding: 12px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 6px 0px var(--shadow-color), 0 10px 15px rgba(0,0,0,0.06);
      border: 3px solid var(--border-color);
      
      /* Radius justert litt ut for at større kort ikke skal krasje med logoen */
      --radius: 255px;
      --angle: calc(var(--index) * (360deg / 6) - 90deg);
      left: calc(50% + var(--radius) * cos(var(--angle)) - 77px);
      top: calc(50% + var(--radius) * sin(var(--angle)) - 75px);
    }

    .resource-card:hover {
      transform: scale(1.08) translateY(-4px);
      box-shadow: 0 10px 0px var(--shadow-color), 0 15px 20px rgba(0,0,0,0.1);
      z-index: 30;
    }

    .resource-card:active {
      transform: scale(0.98);
      box-shadow: 0 2px 0px var(--shadow-color), 0 4px 6px rgba(0,0,0,0.1);
    }

    /* ØKT STØRRELSE PÅ BILDENE */
    .card-img-wrapper { 
      height: 75px; /* Økt fra 60px til 75px */
      width: 100%;
      display: flex; 
      align-items: center; 
      justify-content: center;
      margin-bottom: 8px;
    }

    .card-img { 
      max-width: 95%; /* Økt fra 85% */
      max-height: 100%; 
      object-fit: contain; 
      filter: drop-shadow(0 3px 5px rgba(0,0,0,0.05));
    }

    .card-btn {
      width: 100%;
      padding: 6px 0;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.85rem;
      color: white;
      background-color: var(--btn-bg);
      text-align: center;
      box-shadow: 0 3px 0px var(--btn-shadow);
      margin-top: auto;
    }

    .card-nrk {
      --index: 0;
      --border-color: #bae6fd;
      --shadow-color: #38bdf8;
      --btn-bg: #0284c7;
      --btn-shadow: #0369a1;
    }
    
    .card-salaby {
      --index: 1;
      --border-color: #fef08a;
      --shadow-color: #facc15;
      --btn-bg: #eab308;
      --btn-shadow: #ca8a04;
    }

    .card-korarti {
      --index: 2;
      --border-color: #fbcfe8;
      --shadow-color: #f472b6;
      --btn-bg: #db2777;
      --btn-shadow: #be185d;
    }

    .card-super {
      --index: 3;
      --border-color: #bbf7d0;
      --shadow-color: #4ade80;
      --btn-bg: #16a34a;
      --btn-shadow: #15803d;
    }

    .card-tv2 {
      --index: 4;
      --border-color: #ddd6fe;
      --shadow-color: #a78bfa;
      --btn-bg: #7c3aed;
      --btn-shadow: #6d28d9;
    }

    .card-matte {
      --index: 5;
      --border-color: #bbf7d0;
      --shadow-color: #22c55e;
      --btn-bg: #16a34a;
      --btn-shadow: #15803d;
    }

    /* Skalering for mindre skjermer */
    @media (max-height: 700px), (max-width: 670px) {
      .circle-container {
        transform: scale(0.8);
        margin-top: -20px;
      }
    }

    /* --- BOKORM OG BØKER CONTAINER --- */
    .bookworm-container {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100vw;
      height: 70px;
      pointer-events: none;
      z-index: 99;
      overflow: hidden;
    }

    .books-shelf {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      display: flex !important;
      flex-direction: row !important;
      justify-content: space-between !important;
      align-items: flex-end;
      padding: 0 40px !important;
      box-sizing: border-box !important;
      z-index: 1;
    }

    .book-group {
      display: flex !important;
      align-items: flex-end;
      gap: 3px;
    }

    .book {
      width: var(--w);
      height: var(--h);
      background-color: var(--bg);
      border-radius: 3px 3px 0 0;
      transform: rotate(var(--r));
      transform-origin: bottom center;
      border-left: 2px solid rgba(255, 255, 255, 0.25);
      box-shadow: 2px 0 4px rgba(0, 0, 0, 0.15);
      position: relative;
    }

    .book::after {
      content: '';
      position: absolute;
      top: 6px;
      left: 0;
      width: 100%;
      height: 3px;
      background: rgba(255, 255, 255, 0.4);
    }

    .bookworm {
      width: 210px;
      height: 70px;
      position: absolute;
      bottom: -4px;
      z-index: 2;
      animation: crawlAcross 130s linear infinite;
    }

    @keyframes crawlAcross {
      0% { left: -230px; transform: scaleX(1); }
      48% { left: 100vw; transform: scaleX(1); }
      50% { left: 100vw; transform: scaleX(-1); }
      98% { left: -230px; transform: scaleX(-1); }
      100% { left: -230px; transform: scaleX(1); }
    }

    .worm-whole {
      animation: inchWormBevegelse 4.8s ease-in-out infinite;
      transform-origin: 20px 60px;
    }

    @keyframes inchWormBevegelse {
      0%, 100% { transform: scaleX(1) scaleY(1) translateY(0); }
      45% { transform: scaleX(0.72) scaleY(1.35) translateY(-2px); }
    }
  </style>
</head>
<body>

  <!-- ANIMERT BIE SOM SVINGER UNNA LOGOEN -->
  <div class="bee-container">
    <svg class="flying-bee" viewBox="0 0 100 100">
      <ellipse class="wing" cx="42" cy="25" rx="12" ry="22" fill="rgba(224, 242, 254, 0.85)" stroke="#0284c7" stroke-width="2" transform="rotate(-20 42 25)" />
      <ellipse class="wing" cx="58" cy="22" rx="10" ry="20" fill="rgba(224, 242, 254, 0.85)" stroke="#0284c7" stroke-width="2" transform="rotate(15 58 22)" />
      <ellipse cx="50" cy="55" rx="28" ry="20" fill="#facc15" stroke="#1e293b" stroke-width="2.5" />
      <path d="M 38 37 Q 36 55 38 73" stroke="#1e293b" stroke-width="6" fill="none" stroke-linecap="round" />
      <path d="M 50 35 Q 48 55 50 75" stroke="#1e293b" stroke-width="6" fill="none" stroke-linecap="round" />
      <path d="M 62 37 Q 60 55 62 73" stroke="#1e293b" stroke-width="6" fill="none" stroke-linecap="round" />
      <polygon points="22,55 12,52 12,58" fill="#1e293b" />
      <circle cx="72" cy="55" r="12" fill="#1e293b" />
      <circle cx="75" cy="51" r="3.5" fill="#ffffff" />
      <circle cx="76.5" cy="51" r="1.8" fill="#000000" />
      <path d="M 76 44 Q 82 36 86 38" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round" />
      <circle cx="86" cy="38" r="2" fill="#1e293b" />
    </svg>
  </div>

  <!-- SIRKELCONTAINER MED LOGO I SENTRUM OG KORT RUNDT -->
  <div class="circle-container">

    <!-- SKOLE-LOGO MED KONFETTI-FEIRING -->
    <div class="header-container" onclick="fyrAvKonfetti()" title="Klikk for en overraskelse! 🎉">
      <img src="haanes.png" alt="Hånes skole" class="school-logo">
    </div>

    <!-- RESSURSKORT SOM PLASSERES I SIRKEL -->
    <a href="https://tv.nrk.no/programmer/nrk-skole" target="_blank" class="resource-card card-nrk">
      <div class="card-img-wrapper">
        <img src="Bilder/nrkskole.png" alt="NRK Skole" class="card-img">
      </div>
      <div class="card-btn">NRK Skole 🎬</div>
    </a>

    <a href="https://skole.salaby.no/" target="_blank" class="resource-card card-salaby">
      <div class="card-img-wrapper">
        <img src="Bilder/salaby.png" alt="Salaby" class="card-img">
      </div>
      <div class="card-btn">Salaby 🐝</div>
    </a>

    <a href="https://www.korarti.no/" target="_blank" class="resource-card card-korarti">
      <div class="card-img-wrapper">
        <img src="Bilder/korarti.png" alt="Korarti" class="card-img">
      </div>
      <div class="card-btn">Korarti 🎵</div>
    </a>

    <a href="https://tv.nrk.no/nrksuper/" target="_blank" class="resource-card card-super">
      <div class="card-img-wrapper">
        <img src="Bilder/nrksuper.png" alt="NRK Super" class="card-img">
      </div>
      <div class="card-btn">NRK Super 🚀</div>
    </a>

    <a href="https://www.elevkanalen.no/" target="_blank" class="resource-card card-tv2">
      <div class="card-img-wrapper">
        <img src="Bilder/tv2skole.png" alt="Elevkanalen" class="card-img">
      </div>
      <div class="card-btn">Elevkanalen 📺</div>
    </a>

    <a href="matematikk.html" class="resource-card card-matte">
      <div class="card-img-wrapper">
        <img src="Bilder/matte.png" alt="Matte-mix" class="card-img">
      </div>
      <div class="card-btn">Matte-mix 🧮</div>
    </a>

  </div>

  <script>
    function fyrAvKonfetti() {
      if (typeof confetti === 'function') {
        confetti({ 
          particleCount: 100, 
          spread: 70, 
          origin: { y: 0.45 } 
        });
      }
    }
  </script>

  <!-- ANIMERT BOKORM (KRAVLER PÅ GULVET) -->
  <div class="bookworm-container">
    <div class="books-shelf">
      <div class="book-group">
        <div class="book" style="--bg: #e91e63; --h: 38px; --w: 14px; --r: -4deg;"></div>
        <div class="book" style="--bg: #3b82f6; --h: 50px; --w: 18px; --r: 0deg;"></div>
        <div class="book" style="--bg: #10b981; --h: 42px; --w: 16px; --r: 3deg;"></div>
        <div class="book" style="--bg: #f59e0b; --h: 54px; --w: 20px; --r: -2deg;"></div>
        <div class="book" style="--bg: #8b5cf6; --h: 40px; --w: 15px; --r: 0deg;"></div>
      </div>
      <div class="book-group">
        <div class="book" style="--bg: #ef4444; --h: 48px; --w: 17px; --r: -6deg;"></div>
        <div class="book" style="--bg: #06b6d4; --h: 58px; --w: 22px; --r: 0deg;"></div>
        <div class="book" style="--bg: #84cc16; --h: 38px; --w: 14px; --r: 4deg;"></div>
      </div>
      <div class="book-group">
        <div class="book" style="--bg: #ec4899; --h: 52px; --w: 19px; --r: -3deg;"></div>
        <div class="book" style="--bg: #6366f1; --h: 44px; --w: 16px; --r: 0deg;"></div>
        <div class="book" style="--bg: #14b8a6; --h: 48px; --w: 18px; --r: 5deg;"></div>
      </div>
      <div class="book-group">
        <div class="book" style="--bg: #a855f7; --h: 56px; --w: 21px; --r: -4deg;"></div>
        <div class="book" style="--bg: #0284c7; --h: 40px; --w: 15px; --r: 0deg;"></div>
        <div class="book" style="--bg: #22c55e; --h: 45px; --w: 17px; --r: 2deg;"></div>
      </div>
      <div class="book-group">
        <div class="book" style="--bg: #f43f5e; --h: 46px; --w: 18px; --r: -3deg;"></div>
        <div class="book" style="--bg: #eab308; --h: 52px; --w: 20px; --r: 0deg;"></div>
        <div class="book" style="--bg: #3b82f6; --h: 39px; --w: 15px; --r: 4deg;"></div>
      </div>
    </div>

    <svg class="bookworm" viewBox="0 0 240 70">
      <g class="worm-whole">
        <circle cx="20" cy="60" r="9.5" fill="#16a34a" />
        <circle cx="34" cy="60" r="10.5" fill="#22c55e" />
        <circle cx="50" cy="60" r="11" fill="#16a34a" />
        <circle cx="67" cy="60" r="11.5" fill="#22c55e" />
        <circle cx="85" cy="60" r="12" fill="#16a34a" />
        <circle cx="103" cy="60" r="11.5" fill="#22c55e" />
        <circle cx="120" cy="60" r="11" fill="#16a34a" />
        <circle cx="136" cy="60" r="10.5" fill="#22c55e" />
        
        <g transform="translate(154, 56)">
          <circle cx="0" cy="0" r="14" fill="#4ade80" />
          <circle cx="5" cy="-5" r="3.5" fill="#ffffff" />
          <circle cx="6.5" cy="-5" r="1.8" fill="#000000" />
          <path d="M 2 -13 Q 6 -22 12 -24" stroke="#16a34a" stroke-width="2.5" fill="none" stroke-linecap="round" />
          <circle cx="12" cy="-24" r="3" fill="#e91e63" />
          <path d="M 1 5 Q 6 9 10 4" stroke="#000000" stroke-width="2" fill="none" stroke-linecap="round" />
          <rect x="-19" y="3" width="16" height="12" rx="2" fill="#e91e63" transform="rotate(-10)" />
          <line x1="-11" y1="2" x2="-11" y2="13" stroke="#ffffff" stroke-width="1.2" />
        </g>
      </g>
    </svg>
  </div>

</body>
</html>
